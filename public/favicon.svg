<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FFDF73" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base (Squircle) -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="4" />

  <!-- Inner Elegant Border -->
  <rect x="12" y="12" width="104" height="104" rx="20" fill="none" stroke="url(#gold-grad)" stroke-width="1" stroke-opacity="0.4" />

  <!-- Neptora Emblem (Stylized Legal 'N' with Star Crest) -->
  <!-- Top Crest Star -->
  <polygon points="64,22 66.5,28 73,28 67.5,32 70,38 64,34 58,38 60.5,32 55,28 61.5,28" fill="url(#gold-grad)" />

  <!-- Main 'N' Monogram -->
  <g fill="url(#gold-grad)" filter="url(#gold-glow)">
    <!-- Left Column -->
    <path d="M38 42 L48 42 L48 88 L38 88 Z" />
    <!-- Diagonal -->
    <polygon points="44,42 54,42 84,88 74,88" />
    <!-- Right Column -->
    <path d="M80 42 L90 42 L90 88 L80 88 Z" />
  </g>

  <!-- Base Notary Quill / Scale Accent line -->
  <path d="M36 94 L92 94" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
